<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Extension Asistente Lobby</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6fb;
        --card: #ffffff;
        --text: #101828;
        --muted: #475467;
        --line: #d9e0eb;
        --primary: #174ea6;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: var(--bg);
        color: var(--text);
        display: flex;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 18px 42px rgba(16, 24, 40, 0.12);
        max-width: 420px;
        padding: 24px;
        width: 100%;
      }

      h1 {
        font-size: 22px;
        line-height: 1.2;
        margin: 0 0 10px;
      }

      p {
        color: var(--muted);
        margin: 0 0 16px;
      }

      button {
        background: var(--primary);
        border: 0;
        border-radius: 9px;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 11px 14px;
        width: 100%;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      #status {
        color: var(--muted);
        font-size: 14px;
        margin-top: 14px;
        min-height: 20px;
      }

      #status.error {
        color: var(--danger);
      }
    </style>
    <script src="/firebase-config.js"></script>
    <script src="/extension-auth-redirects.js"></script>
  </head>
  <body>
    <main>
      <h1>Entrar a Asistente Lobby</h1>
      <p>Inicia sesion con Google para volver de forma segura a la extension.</p>
      <button id="googleLogin" type="button">Entrar con Google</button>
      <p id="status">Esperando autenticacion...</p>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
      import {
        getAuth,
        GoogleAuthProvider,
        onAuthStateChanged,
        signInWithPopup
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

      const status = document.querySelector("#status");
      const loginButton = document.querySelector("#googleLogin");
      const params = new URLSearchParams(window.location.search);
      const redirectUri = params.get("redirectUri") || "";
      const state = params.get("state") || "";

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.className = isError ? "error" : "";
      }

      async function finish(user) {
        if (!window.isAllowedLobbyExtensionRedirect(redirectUri)) {
          setStatus("Destino de extension no autorizado.", true);
          return;
        }

        const idToken = await user.getIdToken();
        const resultUrl = new URL(redirectUri);
        const result = new URLSearchParams();
        result.set("state", state);
        result.set("idToken", idToken);
        result.set("refreshToken", user.refreshToken || "");
        result.set("email", user.email || "");
        result.set("uid", user.uid || "");
        resultUrl.hash = result.toString();
        setStatus("Login correcto. Volviendo a la extension...");
        window.location.replace(resultUrl.toString());
      }

      try {
        if (!window.LOBBY_FIREBASE_CONFIG) {
          throw new Error("Falta public/firebase-config.js");
        }
        if (!redirectUri || !state) {
          throw new Error("Faltan parametros de extension.");
        }
        if (!window.isAllowedLobbyExtensionRedirect || !window.isAllowedLobbyExtensionRedirect(redirectUri)) {
          throw new Error("Destino de extension no autorizado. Contacta al administrador.");
        }

        const app = initializeApp(window.LOBBY_FIREBASE_CONFIG);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        loginButton.addEventListener("click", async () => {
          try {
            loginButton.disabled = true;
            setStatus("Abriendo login de Google...");
            const result = await signInWithPopup(auth, provider);
            await finish(result.user);
          } catch (error) {
            loginButton.disabled = false;
            setStatus(error.message || "No se pudo iniciar sesion.", true);
          }
        });

        onAuthStateChanged(auth, async (user) => {
          if (user) await finish(user);
        });
      } catch (error) {
        loginButton.disabled = true;
        setStatus(error.message || "Error de configuracion.", true);
      }
    </script>
  </body>
</html>
